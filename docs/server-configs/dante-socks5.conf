# Dante SOCKS5 Proxy Configuration for Advanced Tunnel
# For legitimate use only with servers you own
# Default port: 1080

# Log configuration
logoutput: syslog
user.privileged: root
user.unprivileged: nobody

# Internal address (where Dante listens)
internal: 0.0.0.0 port = 1080

# External address (interface to use for outgoing connections)
external: eth0

# Authentication method
# Options: none, pam, passwd, gssapi
method: none

# Client authentication method
clientmethod: none

# Client rules - allow all by default (restrict in production!)
client pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    log: connect disconnect error
}

# Pass rules - allow all traffic
pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    protocol: tcp udp
    log: connect disconnect error
}

# Block all other traffic
block {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    log: connect error
}

# Socket options
socket: bind = 0.0.0.0
socket: connect-timeout = 60
socket: io-timeout = 300
socket: keepalive = yes

# Buffer sizes
socket: send-buffer = 65536
socket: receive-buffer = 65536

# DNS
socket: dns-timeout = 30
socket: dns-retry = 3

# For IPv6 support (uncomment if needed)
# internal: ::1 port = 1080
# external: eth0
# client pass { from: ::/0 to: ::/0 }
# pass { from: ::/0 to: ::/0 protocol: tcp udp }
