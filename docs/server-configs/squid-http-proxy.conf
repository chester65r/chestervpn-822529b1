# Squid HTTP Proxy Configuration for Advanced Tunnel
# For legitimate use only with servers you own
# Default port: 3128

# Basic configuration
http_port 3128
visible_hostname http-proxy

# Network ACLs
acl localnet src 0.0.0.1-0.255.255.255  # RFC 1122 "this" network (LAN)
acl localnet src 10.0.0.0/8             # RFC 1918 local private network (LAN)
acl localnet src 172.16.0.0/12          # RFC 1918 local private network (LAN)
acl localnet src 192.168.0.0/16         # RFC 1918 local private network (LAN)
acl localnet src fc00::/7               # RFC 4193 local private network range
acl localnet src fe80::/10              # RFC 4291 link-local (directly plugged) machines

# Safe ports for CONNECT
acl SSL_ports port 443
acl SSL_ports port 563
acl SSL_ports port 8443
acl SSL_ports port 8883

# Safe ports for standard HTTP
acl Safe_ports port 80
acl Safe_ports port 21
acl Safe_ports port 443
acl Safe_ports port 70
acl Safe_ports port 210
acl Safe_ports port 1025-65535
acl Safe_ports port 280
acl Safe_ports port 488
acl Safe_ports port 591
acl Safe_ports port 777

# CONNECT method for HTTPS
acl CONNECT method CONNECT

# Only allow cachemgr access from localhost
acl localhost src 127.0.0.1/32 ::1
acl to_localhost dst 127.0.0.0/8 0.0.0.0/32 ::1

# Access rules
http_access allow CONNECT SSL_ports
http_access allow localhost manager
http_access deny manager
http_access allow localnet
http_access allow localhost
http_access deny all

# HTTP access rules
http_reply_access allow all
icp_access allow localnet
icp_access deny all

# Cache rules
cache deny all

# Forwarding
forwarded_for transparent
via off

# Timeouts (for better performance with tunnels)
request_timeout 30 minutes
persistent_request_timeout 1 hour
read_timeout 1 hour
connect_timeout 1 minute

# Memory settings
cache_mem 256 MB
maximum_object_size 256 MB
minimum_object_size 0 KB
maximum_object_size_in_memory 32 KB

# Logging
access_log /var/log/squid/access.log
cache_log /var/log/squid/cache.log
cache_store_log none

# PID file
pid_filename /var/run/squid.pid

# Cache directory (disabled for proxy-only mode)
cache_dir null /tmp

# Security
httpd_suppress_version_string on
header_access Via deny all
header_access Server deny all
header_access X-Cache deny all
header_access X-Cache-Lookup deny all
