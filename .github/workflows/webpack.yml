name: Web app CI

on:
  push:
    branches:
      - main
      - feature/authorized-carrier-transports
  pull_request:
    branches:
      - main
      - feature/authorized-carrier-transports

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run carrier, transport and Android policy tests
        run: bun run test -- src/test/carrier-profiles.test.ts src/test/transport-adapters.test.ts src/test/android-hardening.test.ts src/test/android-workflow.test.ts

      - name: Build the TanStack Start / Vite application
        run: bun run build
