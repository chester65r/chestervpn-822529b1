name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ChesterVPN APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go 1.24 (for libbox core)
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install Android SDK 35 & NDK
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'

      - name: Cache libbox.aar (sing-box v1.12.17)
        id: cache-libbox
        uses: actions/cache@v4
        with:
          path: app/libs/libbox.aar
          key: libbox-aar-sing-box-v1.12.17-ndk27

      - name: Build libbox.aar from SagerNet/sing-box
        if: steps.cache-libbox.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          git clone --depth 1 --branch v1.12.17 https://github.com/SagerNet/sing-box.git /tmp/sing-box
          mkdir -p /tmp/sing-box-for-android/app/libs
          cd /tmp/sing-box
          export PATH="$(go env GOPATH)/bin:$PATH"
          make lib_install
          make lib_android
          AAR_PATH="$(find /tmp/sing-box /tmp/sing-box-for-android -name 'libbox.aar' | head -n 1)"
          if [ -z "$AAR_PATH" ]; then
            echo "Error: libbox.aar was not produced by make lib_android" >&2
            exit 1
          fi
          cp "$AAR_PATH" "$GITHUB_WORKSPACE/app/libs/libbox.aar"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate Gradle wrapper in repository root
        run: |
          gradle wrapper --gradle-version 8.10.2 --distribution-type bin
          chmod +x ./gradlew

      - name: Build debug APK (./gradlew assembleDebug)
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload ChesterVPN APK
        uses: actions/upload-artifact@v4
        with:
          name: chestervpn-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
