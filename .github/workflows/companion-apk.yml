name: Companion Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - safe-app-shell
    paths:
      - "android-companion/app/src/**"
      - "android-companion/scripts/**"
      - "android-companion/app/build.gradle.kts"
      - "android-companion/build.gradle.kts"
      - "android-companion/settings.gradle.kts"
      - "android-companion/gradle.properties"
      - ".github/workflows/companion-apk.yml"
  pull_request:
    branches:
      - main
    paths:
      - "android-companion/**"
      - ".github/workflows/companion-apk.yml"

concurrency:
  group: companion-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Verify local-only companion scope
        run: |
          python3 android-companion/scripts/verify_scope.py
          python3 -m unittest discover -s android-companion/scripts -p "test_*.py"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses < <(yes)

      - name: Install Android 16 build platform
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"
          cache-provider: basic

      - name: Run tests, lint, and assemble debug APK
        run: gradle --no-daemon -p android-companion testDebugUnitTest lintDebug assembleDebug

      - name: Generate APK checksum
        working-directory: android-companion/app/build/outputs/apk/debug
        run: sha256sum app-debug.apk | tee app-debug.apk.sha256

      - name: Upload debug APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: chester-vpn-companion-debug
          path: |
            android-companion/app/build/outputs/apk/debug/app-debug.apk
            android-companion/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
