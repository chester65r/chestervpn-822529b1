name: Companion Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - safe-app-shell
    paths:
      - "android-companion/**"
      - ".github/workflows/companion-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 build platform
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"
          cache-provider: basic

      - name: Run tests, lint, and assemble debug APK
        run: gradle --no-daemon -p android-companion testDebugUnitTest lintDebug assembleDebug

      - name: Generate APK checksum
        working-directory: android-companion/app/build/outputs/apk/debug
        run: sha256sum app-debug.apk | tee app-debug.apk.sha256

      - name: Upload debug APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: chester-vpn-companion-debug
          path: |
            android-companion/app/build/outputs/apk/debug/app-debug.apk
            android-companion/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
