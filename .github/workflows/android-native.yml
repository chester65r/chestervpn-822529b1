name: Android native blueprint

on:
  push:
    branches:
      - feature/authorized-carrier-transports
  pull_request:
    branches:
      - main
      - feature/authorized-carrier-transports
    paths:
      - "src/lib/android-blueprint.ts"
      - "src/lib/native-auth-blueprint.ts"
      - "src/lib/carrier-profiles.ts"
      - "native/android/**"
      - ".github/workflows/android-native.yml"

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install web project dependencies
        run: bun install --frozen-lockfile

      - name: Run project tests
        run: bun test

      - name: Generate native Android project
        run: bun native/android/generate-project.ts "$RUNNER_TEMP/tunnel-android"

      - name: Download and verify Gradle 8.9
        shell: bash
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/gradle-8.9-bin.zip" https://services.gradle.org/distributions/gradle-8.9-bin.zip
          echo "d725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab  $RUNNER_TEMP/gradle-8.9-bin.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/gradle-8.9-bin.zip" -d "$RUNNER_TEMP"

      - name: Create pinned Gradle wrapper
        run: "$RUNNER_TEMP/gradle-8.9/bin/gradle" -p "$RUNNER_TEMP/tunnel-android" wrapper --gradle-version 8.9 --distribution-type bin

      - name: Build Android debug/release/test APKs and run lint
        run: bash native/android/run-checks.sh "$RUNNER_TEMP/tunnel-android" build

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tunnel-console-debug-apk
          path: ${{ runner.temp }}/tunnel-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
